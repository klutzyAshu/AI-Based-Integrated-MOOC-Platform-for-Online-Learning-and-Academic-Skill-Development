# ===== Server =====
server.port=8080

# ===== Datasource (MariaDB) =====
spring.datasource.url=jdbc:mariadb://localhost:3306/mooc_platform?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:change-this-super-secret-key-in-prod-please-change}

# ===== AI layer =====
app.ai.provider=${AI_PROVIDER:openai}
app.ai.api-key=${AI_API_KEY:}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
app.ai.model=${AI_MODEL:gpt-4o-mini}

# ===== File storage =====
app.storage.root=${STORAGE_ROOT:./storage}

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info

# ===== Logging =====
logging.level.com.mooc=INFO
logging.level.org.springframework.security=WARN
